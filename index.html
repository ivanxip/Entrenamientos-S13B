<html lang="es"><head><meta charset="utf-8">

<title>Entrenamientos</title>
<style>
:root{--bg:#f2f6f1;--card:#fff;--ink:#14201a;--soft:#66756b;--line:#dbe4dd;--ac:#65a30d;--bad:#d9534f;--warn:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a120d;--card:#141f18;--ink:#e9f4ec;--soft:#7e9586;--line:#223129;--ac:#a3e635;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0a120d;--card:#141f18;--ink:#e9f4ec;--soft:#7e9586;--line:#223129;--ac:#a3e635;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;font-size:15px;max-width:520px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:15px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.x{color:var(--bad)}button.s{padding:5px 9px;font-size:13px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}.row>*{margin-bottom:0}.grow{flex:1;min-width:0}
.soft{color:var(--soft);font-size:12.5px}.tag{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--soft)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{white-space:nowrap}
.mn{width:64px;text-align:center;padding:7px}
.parallel{border:1px solid var(--ac);background:#0d1510;border-radius:14px;padding:12px;margin-bottom:10px}.parallel-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.parallel-title{font-weight:800}.parallel-note{font-size:12px;color:var(--soft);margin:5px 0 9px}.group{border:1px solid var(--line);border-radius:11px;padding:9px;margin-top:8px;background:var(--card)}.group-title{font-weight:700;font-size:13px}.pos-select{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 9px}.pos-select label{display:flex;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--bg)}.poschips{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.poschip{font-size:10px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);color:var(--soft)}.parallel-total{font-size:13px;font-weight:700;color:var(--ac);margin-top:8px}.parallel-editor{border:1px solid var(--ac);border-radius:14px;padding:12px;margin-bottom:10px}
/* ===== Rediseño "noche de campo" ===== */
body{background:radial-gradient(900px 480px at 50% -120px,#1c2d21 0%,var(--bg) 62%);background-attachment:fixed}
h1{font-size:21px;margin:8px 0 14px;letter-spacing:.2px;background:linear-gradient(90deg,var(--ac),#2dd4bf);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border-radius:16px;padding:13px 14px;box-shadow:0 4px 18px rgba(0,0,0,.30);border:1px solid var(--line)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .card{box-shadow:0 2px 10px rgba(20,40,25,.08)}}
button{border-radius:12px;transition:transform .08s ease,box-shadow .15s ease,filter .15s ease}
button:active{transform:scale(.96)}
button.p,button.on{background:linear-gradient(135deg,var(--ac),#34d399);color:#08170c;border-color:transparent;box-shadow:0 3px 12px rgba(52,211,153,.30)}
.chips button{border-radius:999px}
.chips button.on{box-shadow:0 2px 12px rgba(163,230,53,.30)}
.chips::-webkit-scrollbar{display:none}
.tag{border-radius:999px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px rgba(163,230,53,.14)}
.bar{background:var(--line);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.bar i{border-radius:6px}
.parallel{background:linear-gradient(160deg,#10251a 0%,#0b1710 100%);border:1px solid #2b4a33;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.parallel-editor{border:1px solid #2b4a33;background:linear-gradient(160deg,#10251a,#0b1710)}
.group{background:rgba(255,255,255,.04)}

/* ===== Cambio radical: nav inferior, hero, tarjetas-día, biblioteca ===== */
body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;gap:8px;padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:50;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;font-size:11.5px;border-radius:12px}
.bnav button.on{background:linear-gradient(135deg,var(--ac),#34d399);color:#08170c;border-color:transparent}
.hero{border-radius:18px;padding:15px 16px;margin-bottom:12px;background:linear-gradient(140deg,#134023,#0a1a10 75%);border:1px solid #245232;color:#eafff0;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.hero .soft{color:#9fd8ae}
.hero-t{font-size:21px;font-weight:800;letter-spacing:.2px;margin-top:2px}
.scard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 4px 18px rgba(0,0,0,.30);cursor:pointer;transition:transform .08s ease}
.scard:active{transform:scale(.97)}
.sday{width:48px;height:48px;border-radius:14px;background:linear-gradient(150deg,var(--ac),#34d399);color:#08170c;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.sday b{font-size:18px;line-height:1}
.sday span{font-size:9px;font-weight:800;text-transform:uppercase}
.catdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.csec{font-weight:800;font-size:12px;letter-spacing:.7px;margin:6px 0;color:var(--soft)}
.sep{border:none;border-top:1px dashed var(--line);margin:14px 0}
.cir{border:1px solid #2b4a33;border-radius:14px;padding:11px;margin-bottom:9px;background:linear-gradient(160deg,#10251a,#0b1710)}

<script>

var CATS=["Charla","Activación","Rondos","Técnica","Físico","Táctica","Finalización","Juego","Específico","Pausa"];
var POS=["Porteros","Defensas","Laterales","Pivotes","Interiores","Mediapuntas","Extremos","Delanteros"];
var PS={Porteros:"POR",Defensas:"DEF",Laterales:"LAT",Pivotes:"PIV",Interiores:"INT",Mediapuntas:"MP",Extremos:"EXT",Delanteros:"DEL"};
var CC={Charla:"#a78bfa",Activación:"#38bdf8",Rondos:"#a3e635",Técnica:"#fbbf24",Físico:"#fb7185",Táctica:"#34d399",Finalización:"#fb923c",Juego:"#60a5fa",Específico:"#e879f9",Pausa:"#94a3b8"};
var LIB=[{"id":"e01","n":"Charla inicial de sesión","c":"Charla","m":8,"d":"Material: ninguno, jugadores sentados en círculo. Desarrollo: presentar en 2-3 ideas el objetivo del entrenamiento y su vínculo con el próximo partido; pedir a 2 jugadores que resuman la idea con sus palabras. Claves: mensajes cortos, lenguaje sencillo, máximo 8 minutos.","v":"","t":"talk","L":{"p":[[100,22,"B"],[150,40,"B"],[160,75,"B"],[125,98,"B"],[75,98,"B"],[40,75,"B"],[50,40,"B"]],"g":[[85,55,30,16]]},"pos":[]},{"id":"e02","n":"Charla táctica con pizarra","c":"Charla","m":10,"d":"Material: pizarra y chicles o conos para marcar posiciones. Desarrollo: dibujar la posición de salida y 2-3 situaciones de juego con y sin balón; preguntar a los jugadores dónde deben estar antes de corregir. Claves: una sola idea principal por charla y comprobación con preguntas.","v":"","t":"talk","L":{"g":[[65,8,70,24]],"p":[[40,70,"B"],[100,90,"B"],[160,70,"B"]]},"pos":[]},{"id":"e03","n":"Activación articular guiada","c":"Charla","m":8,"d":"Material: ninguno. Desarrollo: en círculo, movilidad de tobillos, cadera y hombros 20 s por ejercicio antes de coger el balón; un capitán marca el ritmo. Claves: amplitud progresiva, sin rebotes bruscos, respiración tranquila.","v":"","t":"","L":{"p":[[100,20,"B"],[150,35,"B"],[165,70,"B"],[130,95,"B"],[70,95,"B"],[35,70,"B"],[50,35,"B"]],"co":[[100,58]]},"pos":[]},{"id":"e04","n":"Vuelta a la calma y charla final","c":"Charla","m":7,"d":"Material: esterillas si las hay. Desarrollo: estiramientos de cuádriceps, isquios, glúteos y espalda 20 s cada uno; cerrar con 2 puntos fuertes y 1 mejora del día. Claves: estirar sin dolor y aprovechar el tono tranquilo para el mensaje final.","v":"","t":"talk","L":{"p":[[50,80,"B"],[100,80,"B"],[150,80,"B"]],"path":["M50,80 L50,50","M100,80 L100,50","M150,80 L150,50"]},"pos":[]},{"id":"e05","n":"Activación con balón en cuadrado","c":"Activación","m":10,"d":"Material: un balón por jugador y 4 conos. Desarrollo: conducción libre en cuadrado de 15x15 m; a la señal cambian de ritmo, dirección o pie dominante; 3-4 paradas breves para indicaciones. Claves: cabeza arriba, toques cortos y acelerar tras cada cambio de dirección.","v":"","t":"","L":{"p":[[30,90,"B"]],"path":["M30,90 L60,30 L100,90 L140,30 L170,90"]},"pos":[]},{"id":"e06","n":"Pase y desmarque en parejas","c":"Activación","m":10,"d":"Material: un balón por pareja. Desarrollo: pase al pie y desmarcarse al espacio libre antes de recibir; en la tercera vuelta añadir un defensor pasivo. Claves: desmarque antes de que llegue el balón y pase al pie que libera la orientación del control.","v":"","t":"","L":{"p":[[50,70,"B"],[150,40,"Y"]],"a":[[50,70,150,40],[150,40,90,90]]},"pos":[]},{"id":"e07","n":"Movilidad y coordinación","c":"Activación","m":8,"d":"Material: conos en las líneas. Desarrollo: skipping, talones-glúteos, zancadas y saltos laterales de línea a línea, 2 vueltas por patrón. Claves: postura erguida, brazos activos y apoyos cortos.","v":"","t":"","L":{"z":[20,180],"p":[[20,55,"B"]],"path":["M20,55 L180,55"]},"pos":[]},{"id":"e08","n":"Espejo de desplazamientos","c":"Activación","m":6,"d":"Material: ninguno. Desarrollo: parejas frente a frente a 2 m; uno lidera desplazamientos laterales y giros y el otro lo imita; cambio cada 30 s. Claves: rodillas flexionadas, pasos cortos y no cruzar las piernas en los giros.","v":"","t":"","L":{"p":[[60,55,"B"],[140,55,"Y"]],"path":["M60,55 L25,55 L95,55","M140,55 L175,55 L105,55"]},"pos":[]},{"id":"e09","n":"Pilla-pilla con balón","c":"Activación","m":8,"d":"Material: un balón por jugador y 2 petos. Desarrollo: todos conducen; los dos pilladores intentan tocar con el pie el balón de otro, que pasa a pillar. Claves: proteger el cuerpo entre rival y balón, cambios de ritmo y mirar de reojo.","v":"","t":"","L":{"p":[[30,30,"B"],[160,30,"B"],[30,90,"B"],[160,90,"B"],[95,60,"R"]],"path":["M95,60 L140,35"]},"pos":[]},{"id":"e10","n":"Ronda de movilidad dinámica","c":"Activación","m":8,"d":"Material: ninguno. Desarrollo: dos filas en movimiento por la banda: círculos de brazos, rotaciones de tronco, balanceos de pierna y zancada con rotación; 20 m de ida y vuelta. Claves: amplitud controlada, coordinación brazo-pierna contraria y grupo sin parar.","v":"","t":"","L":{"z":[20,180],"p":[[20,55,"B"]],"path":["M20,55 L180,55"]},"pos":[]},{"id":"e11","n":"Toca, corre y vuelve","c":"Activación","m":8,"d":"Material: conos a 8 m y balones. Desarrollo: el jugador sale al cono, vuelve recibiendo el pase del compañero y lo devuelve a un toque; el siguiente sale al recibir. Claves: salida explosiva, pase raso al pie y avisar con un «sale».","v":"","t":"","L":{"p":[[50,70,"B"],[150,40,"Y"]],"a":[[50,70,150,40],[150,40,90,90]]},"pos":[]},{"id":"e12","n":"Reacción a la señal","c":"Activación","m":6,"d":"Material: conos de 2 colores. Desarrollo: parejas de espaldas al campo; a la señal o al giro del balón ganan el cono del color indicado; 6-8 repeticiones. Claves: posición de salida baja, arranque sin balanceo y frenada en el cono.","v":"","t":"","L":{"z":[20,180],"p":[[20,55,"B"]],"path":["M20,55 L180,55"]},"pos":[]},{"id":"e13","n":"Mini-rondos de activación 3 vs 1","c":"Activación","m":8,"d":"Material: petos y un balón por cuadrícula. Desarrollo: cuadrículas de 8x8 m con rondo 3v1 de 60-90 s; rotación del defensor al perderse. Claves: pases firmes, triangulación y defender la línea del pase, no al balón.","v":"","t":"","L":{"co":[[60,20],[140,20],[100,90]],"p":[[60,20,"B"],[140,20,"B"],[100,90,"B"],[100,45,"R"]],"a":[[60,20,140,20],[140,20,100,90],[100,90,60,20]]},"pos":[]},{"id":"e14","n":"Conducción con mandos","c":"Activación","m":8,"d":"Material: un balón por jugador y conos. Desarrollo: conducción en cuadrado esquivando compañeros; el entrenador da mandos: cambio de pie, frenada, giro 180 grados. Claves: ejecutar el mando sin perder el balón y toques cortos en zonas de tráfico.","v":"","t":"","L":{"p":[[40,30,"B"],[160,30,"B"],[40,90,"B"],[160,90,"B"],[100,60,"Y"]],"path":["M20,60 Q60,20 100,60 T180,60"]},"pos":[]},{"id":"e15","n":"Rondo 3 vs 1","c":"Rondos","m":10,"d":"Material: 4 conos, 1 balón y 1 peto. Desarrollo: triángulo de 8-10 m; tres pasan y uno presiona; quien pierde el balón entra al centro. Claves: pases al pie abierto, moverse tras pasar y presión en la línea del pase.","v":"","t":"","L":{"co":[[60,20],[140,20],[100,90]],"p":[[60,20,"B"],[140,20,"B"],[100,90,"B"],[100,45,"R"]],"a":[[60,20,140,20],[140,20,100,90],[100,90,60,20]]},"pos":[]},{"id":"e16","n":"Rondo 4 vs 2","c":"Rondos","m":10,"d":"Material: 4 conos, 1 balón y 2 petos. Desarrollo: cuadrado 10x10 m, cuatro exteriores contra dos centrales; cambio por pérdida. Claves: pases que rompan la primera presión, amplitud y defensor cercano que sale al pase.","v":"","t":"","L":{"co":[[55,15],[145,15],[145,95],[55,95]],"p":[[55,15,"B"],[145,15,"B"],[145,95,"B"],[55,95,"B"],[85,45,"R"],[115,65,"R"]],"a":[[55,15,145,15],[145,15,145,95]]},"pos":[]},{"id":"e17","n":"Rondo 5 vs 2 en rombo","c":"Rondos","m":12,"d":"Material: 4 conos, 1 balón y 2 petos. Desarrollo: rombo de 12-15 m con un comodín central; cinco contra dos buscando el pase diagonal. Claves: comodín siempre de cara y rotar el rombo tras 4-5 pases.","v":"","t":"","L":{"p":[[100,15,"B"],[40,45,"B"],[160,45,"B"],[40,85,"B"],[160,85,"B"],[85,50,"R"],[115,65,"R"]]},"pos":[]},{"id":"e18","n":"Rondo ancho con 2 comodines","c":"Rondos","m":12,"d":"Material: 8 conos y petos. Desarrollo: cuadrado grande con 2 comodines en los lados cortos; posesión 6+2 contra 4 con cambio por pérdida. Claves: fijar con un lado y cambiar al débil; el comodín apoya al poseedor.","v":"","t":"","L":{"co":[[30,20],[170,20],[170,100],[30,100]],"p":[[30,20,"B"],[100,15,"B"],[170,20,"B"],[170,60,"B"],[170,100,"B"],[100,105,"B"],[30,100,"B"],[30,60,"B"],[80,55,"Y"],[120,65,"Y"]]},"pos":[]},{"id":"e19","n":"Rondo de tres equipos","c":"Rondos","m":12,"d":"Material: petos de 3 colores y 1 balón. Desarrollo: tres equipos de 4; dos mantienen el balón y
