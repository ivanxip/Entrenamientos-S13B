    ses.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).forEach(function(s){
      var t=tot(s);
      h+='<div class="card" onclick="openS(\''+s.id+'\')"><b>'+esc(s.name)+'</b> <span class="tag">'+({programada:"📅 Programada",finalizada:"✅ Finalizada",cancelada:"❌ Cancelada"}[s.st||"programada"])+'</span><div class="soft">'+fd(s.date)+' · '+(s.start||"18:00")+'–'+endT(s)+' · '+t+' min'+(t===TARGET?" ✓":"")+'</div></div>'
    })
  }
  else{
    h+='<button class="p" style="width:100%;margin-bottom:10px" onclick="newEx()">+ Nuevo ejercicio</button>';
    h+='<div class="soft" style="margin-bottom:4px">Filtrar por demarcación:</div><div class="chips">'+["Todas"].concat(POSITIONS).map(function(p){return'<button class="s '+(ppos===p?"on":"")+'" onclick="pp(\''+p+'\')">'+p+'</button>'}).join("")+'</div>';

    CATS.forEach(function(c){
      var l=ex.filter(function(e){
        var pMatch=(ppos==="Todas"||(e.pos&&e.pos.indexOf(ppos)!==-1));
        return e.c===c && pMatch;
      });
      if(l.length){
        h+='<div class="soft" style="margin:10px 0 4px"><b>'+c.toUpperCase()+' ('+l.length+')</b></div>';
        l.forEach(function(e){h+=exRow(e,'<button class="s" onclick="editEx(\''+e.id+'\')">Editar</button>')})
      }
    });
  }

  if(!cur&&!ef)h+=shareCard();
  document.getElementById("app").innerHTML=h;
}

R();
</script>

    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
