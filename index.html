<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2e9d57"><title>Sesiones Sub13</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#14201a;--soft:#66756b;--line:#d9e3dc;--ac:#2e9d57;--bad:#d9534f;--warn:#df9f27}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;max-width:560px;margin:auto;padding:12px 14px 40px}h1{font-size:21px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 9px}.tabs,.row{display:flex;gap:7px;align-items:center}.tabs{margin-bottom:12px}.tabs button,.grow{flex:1}button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;font-weight:600}button.p,button.on{background:var(--ac);border-color:var(--ac);color:#fff}button.x{color:var(--bad)}button.s{font-size:12px;padding:6px 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:7px}.soft{color:var(--soft);font-size:12px;line-height:1.35}.tag,.pos{font-size:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--soft)}.pos{background:#e9f5ed;color:#287d45;border-color:#c9e7d2}.chips{display:flex;gap:5px;overflow:auto;padding-bottom:7px}.chips button{white-space:nowrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meta{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.block{border:2px solid var(--ac);border-radius:14px;padding:10px;margin:9px 0;background:var(--card)}.group{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.group:first-child{border-top:0;margin-top:0}.note{font-size:11px;color:var(--soft);background:var(--bg);border-radius:8px;padding:7px;margin-top:6px}.detail b{display:block;margin-top:7px;font-size:12px}.detail div{font-size:12px;line-height:1.35}.badge{background:var(--ac);color:white;border-radius:7px;padding:3px 6px;font-size:11px;font-weight:700}.danger{border-color:var(--bad)}
</style></head><body><div id="app"></div><script>
const KEY='sub13v3';const CATS=['Charla','Activación','Rondos','Técnica','Físico','Táctica','Finalización','Juego','Específico'];const POS=['Porteros','Defensas','Laterales','Pivotes','Interiores','Mediapuntas','Extremos','Delanteros'];const SHORT={Porteros:'POR',Defensas:'DEF',Laterales:'LAT',Pivotes:'PIV',Interiores:'INT',Mediapuntas:'MP',Extremos:'EXT',Delanteros:'DEL'};
const E=(n,c,m,pos,obj,org,dev,rules,coach,prog)=>({id:crypto.randomUUID(),n,c,m,pos,obj,org,dev,rules,coach,prog});
const SEED=[
E('Charla inicial — objetivo de la sesión','Charla',8,POS,'Transmitir 2-3 objetivos concretos de la sesión y una consigna común.','Jugadores sentados cerca de la zona de entrenamiento; 1 balón o pizarra.','Explicar qué queremos mejorar, cómo lo vamos a trabajar y qué actitud esperamos. Preguntar una cosa para comprobar que lo han entendido.','Máximo 3 ideas; no convertirlo en una charla larga.','Mensaje corto, positivo y concreto.','Antes de un partido, relacionarla con el plan de juego.'),
E('Activación dinámica con balón y orientación','Activación',8,POS,'Elevar temperatura y activar orientación corporal sin perder contacto con el balón.','Cuadrado 20x20 m; un balón por jugador y 4-6 conos.','Conducción libre. A la señal: cambio de dirección, cambio de pie, aceleración de 5 m y nueva conducción. Añadir compañero que cruza el espacio para obligar a levantar la cabeza.','Cabeza arriba antes del cambio; evitar choques; intensidad progresiva.','No correr por correr: mirar, decidir y cambiar de ritmo.','Limitar toques o introducir estímulos de color/número.'),
E('Pase, apoyo y tercer hombre','Activación',10,['Pivotes','Interiores','Mediapuntas','Extremos','Laterales','Delanteros'],'Automatizar pase, apoyo inmediato y aparición del tercer jugador.','Triángulos de 12-15 m, 3 jugadores y 1 balón por grupo.','A pasa a B, B devuelve o deja de cara y C aparece en el espacio libre. Rotar posiciones después de cada acción.','El jugador que pasa debe moverse; no quedarse mirando.','Perfil corporal abierto y pase al pie/espacio adecuado.','Añadir defensor pasivo y luego activo.'),
E('Rondo 4+2 comodines vs 2 — salida por tercer hombre','Rondos',12,['Pivotes','Interiores','Mediapuntas','Defensas','Laterales'],'Mantener la posesión y superar la presión mediante tercer hombre.','Cuadrado 18x18 m; 4 interiores + 2 comodines exteriores vs 2 presionantes.','Moverse después de pasar. Buscar apoyo, pared o tercer hombre. Al robo, cambio inmediato de rol.','No acumular jugadores en la misma línea; recibir perfilado.','Primer control lejos del rival y escaneo antes de recibir.','Reducir espacio o limitar a 2 toques.'),
E('Rondo 5 vs 2 en rombo — pase diagonal','Rondos',12,['Pivotes','Interiores','Mediapuntas','Defensas'],'Mejorar líneas de pase diagonales y orientación corporal.','Rombo de 14x14 m; 5 poseedores y 2 defensores.','Los poseedores ocupan vértices y dos apoyos interiores. Buscar pases diagonales y cambiar de lado tras superar presión.','Evitar pases horizontales continuos; abrir ángulos.','Moverse antes de que llegue el pase.','Añadir un comodín interior.'),
E('Control orientado con defensor a la espalda','Técnica',10,['Pivotes','Interiores','Mediapuntas','Delanteros'],'Controlar con ventaja protegiendo el balón y salir por el lado libre.','Canal 12x10 m; pasador, receptor y defensor a 1-2 m.','Pasador juega al receptor. Este comprueba hombro, perfila, controla lejos del defensor y sale por una de dos puertas.','No recibir de espaldas completamente cuadrado.','Primer toque para escapar, no para detener el balón.','Defensor puede robar a partir del primer control.'),
E('Pase vertical + tercer hombre','Técnica',12,['Pivotes','Interiores','Mediapuntas','Delanteros','Defensas'],'Encontrar jugador entre líneas y progresar con apoyo inmediato.','Tres zonas de 8 m; 4 atacantes y 2 defensores.','Central/pasador encuentra al jugador entre líneas. Este juega de cara con tercer hombre que rompe. Rotar.','El receptor entre líneas debe alejarse del defensor antes de recibir.','Timing del apoyo y calidad del pase vertical.','Permitir giro si el defensor llega tarde.'),
E('1v1 ofensivo desde recepción lateral','Técnica',12,['Extremos','Laterales','Mediapuntas'],'Mejorar desborde y elección entre atacar fuera o dentro.','Pasillo lateral 18x12 m, atacante, defensor y pasador.','Atacante recibe abierto, fija al defensor y decide: cambio de ritmo por fuera, diagonal interior o pase atrás.','Primer control hacia espacio útil; no encarar parado.','Finta corta y aceleración real tras superar.','Añadir finalización tras superar.'),
E('Salida de balón 4+P vs 2 con progresión','Táctica',15,['Porteros','Defensas','Laterales','Pivotes'],'Salir de la primera presión manteniendo estructura y encontrar al pivote.','35x30 m; portero + 4 defensas + pivote vs 2 presionantes; 2 miniporterías al fondo.','Portero inicia; centrales abiertos, laterales altos y anchos, pivote a diferente altura. Superar primera línea y progresar. Si defensores roban, atacan miniporterías.','La progresión solo cuenta al superar la primera línea con pase o conducción controlada.','Central abierto antes de recibir; lateral no escondido; pivote fuera de sombra.','Añadir tercer presionante o permitir que pivote baje entre centrales.'),
E('Basculación de línea de 4 + cobertura del lateral','Táctica',12,['Defensas','Laterales','Pivotes'],'Mover la línea defensiva junta y coordinar salto, cobertura y cierre del lado débil.','35x30 m; línea de 4 contra 3 atacantes. Entrenador sirve a derecha o izquierda.','La línea bascula como bloque. Lateral cercano salta si corresponde, central cercano cubre y lateral lejano cierra segundo palo.','Distancias cortas y misma altura; no perseguir individualmente.','Orientar al rival hacia banda y proteger pase interior.','Añadir delantero para trabajar centros.'),
E('Presión tras pérdida — 5 segundos','Táctica',12,['Defensas','Laterales','Pivotes','Interiores','Mediapuntas','Extremos','Delanteros'],'Reaccionar juntos tras perder el balón para recuperar o impedir progresión.','30x25 m; 5 atacantes vs 1 defensor + comodín exterior.','Al perder, los 3 jugadores más cercanos presionan durante 5 s y los demás cierran líneas de pase. Si recuperan, vuelven a atacar.','Presionar hacia fuera, no todos al balón.','Primer defensor frena; segundo cierra pase; tercero cubre profundidad.','Ampliar espacio o añadir un rival de salida.'),
E('Ataque por banda: lateral + extremo + delantero','Táctica',15,['Laterales','Extremos','Delanteros','Interiores','Pivotes'],'Coordinar amplitud, apoyo y movimientos al área.','Media cancha; lateral, extremo, apoyo interior y delantero vs lateral + central.','Extremo fija ancho, lateral apoya/superpone, jugador interior ofrece apoyo y delantero ataca primer/segundo palo.','No ocupar el mismo carril; delantero no venir siempre al balón.','Timing de ruptura y centro raso atrás cuando corresponde.','Añadir segundo defensor.'),
E('Transición ataque-defensa 4v3','Táctica',15,['Defensas','Laterales','Pivotes','Interiores','Extremos','Delanteros'],'Reaccionar al cambio de posesión y proteger portería.','40x30 m; 4 atacantes vs 3 defensores + portero.','Ataque busca finalizar. Al robo o pérdida, los atacantes reaccionan y defensores salen rápido. Cambiar roles.','Primero proteger profundidad y zona central.','Correr hacia portería propia con orientación correcta, no de espaldas.','Pasar a 5v4.'),
E('Finalización 2v1: fijar, pasar o terminar','Finalización',12,['Extremos','Mediapuntas','Delanteros','Laterales'],'Tomar la decisión correcta en superioridad numérica.','Canal 25x18 m hacia portería; 2 atacantes, 1 defensor y portero.','El portador fija al defensor. Si sale, pase al compañero; si espera, conducir y finalizar.','No pasar demasiado pronto ni conducir hasta el portero.','Fijar al defensor antes del pase.','Añadir defensor recuperador.'),
E('Centro lateral: primer palo, segundo palo y frontal','Finalización',12,['Laterales','Extremos','Delanteros','Mediapuntas'],'Coordinar ocupación del área y atacar diferentes zonas de remate.','Media cancha; centrador en banda, 3 atacantes y 2 defensores.','Centro desde banda. Un atacante primer palo, otro segundo y otro frontal/rechace. Rotar lados.','Carreras con timing; no llegar todos a la misma zona.','Atacar el balón, no esperarlo.','Añadir transición si defensa despeja.'),
E('Remate tras control de espaldas','Finalización',10,['Delanteros','Mediapuntas'],'Ganar ventaja tras recibir de espaldas y finalizar.','Frontal del área; pasador, delantero y defensor pasivo/activo.','Delantero fija, recibe, protege, gira si puede o descarga y rompe para recibir de nuevo. Finaliza.','Cuerpo entre rival y balón; primer toque útil.','Separarse antes de pedir y atacar el espacio después de descargar.','Defensor activo desde el inicio.'),
E('Juego condicionado: gol tras cambio de orientación','Juego',15,['Porteros','Defensas','Laterales','Pivotes','Interiores','Mediapuntas','Extremos','Delanteros'],'Reconocer cuándo cambiar el juego y atacar lado débil.','Medio campo, 7v7/8v8, dos zonas laterales marcadas.','Para que el gol valga, el equipo debe haber cambiado de banda antes de finalizar.','Cambio debe tener intención de progresar, no pase horizontal sin ventaja.','Abrir ancho antes de cambiar.','Obligar a cambiar de orientación dos veces.'),
E('Partido condicionado: ocupar cinco carriles','Juego',20,['Porteros','Defensas','Laterales','Pivotes','Interiores','Mediapuntas','Extremos','Delanteros'],'Mejorar amplitud, profundidad y ocupación racional de espacios.','Campo dividido en cinco carriles verticales. 7v7/8v8.','El equipo debe mantener amplitud y buscar cambiar de carril tras atraer presión.','No invadir todos el carril del balón.','Jugadores alejados del balón también trabajan.','Limitar a 2 jugadores por carril.'),
E('Porteros — blocaje + pase con oposición','Específico',12,['Porteros'],'Mejorar blocaje seguro y primera acción tras atajar.','Portería; portero, entrenador/pasador y 1-2 rivales pasivos.','Tiro controlado a diferentes alturas. Tras blocar, portero levanta cabeza y juega pase raso al apoyo libre.','Primero asegurar blocaje; pase solo después de controlar situación.','Manos detrás/delante según altura; cuerpo preparado para segundo balón.','Añadir oposición real al pase.'),
E('Porteros — 1v1 y salida','Específico',12,['Porteros'],'Mejorar temporización, distancia y decisión en 1v1.','Canal 18x12 m hacia portería; atacante conduce y portero sale.','Portero ajusta distancia, espera momento de toque largo y ataca balón. Rotar.','No salir demasiado pronto; reducir ángulo sin lanzarse.','Pasos cortos, cuerpo grande y paciencia.','Permitir pase a segundo atacante.'),
E('Defensas — 1v1 perfilado hacia banda','Específico',10,['Defensas'],'Defender 1v1 orientando al atacante hacia banda.','Pasillo 18x10 m; defensor y atacante.','Defensor se coloca de lado, controla distancia y guía hacia fuera. Si roba, conduce a línea objetivo.','No cruzar pies ni entrar demasiado lejos.','Perfil corporal y paciencia.','Añadir apoyo ofensivo tras robo.'),
E('Defensas — despeje y segunda jugada','Específico',10,['Defensas','Porteros'],'Despejar con criterio y reaccionar a la segunda jugada.','Área de 25x20 m; centro o balón dividido, línea defensiva y atacantes.','Defensor despeja hacia zona segura, inmediatamente sale para ganar segunda jugada.','No despejar al centro si existe opción lateral.','Primer objetivo: alejar peligro; segundo: salir juntos.','Añadir transición ofensiva.'),
E('Laterales — recibir abierto y progresar','Específico',12,['Laterales'],'Recibir pegado a banda y progresar con primer control hacia delante.','Pasillo lateral 20x12 m; lateral, pasador y defensor pasivo.','Lateral parte ancho, recibe perfilado y ataca espacio. Puede conducir, combinar o volver atrás.','No recibir sobre línea; dejar ángulo para avanzar.','Escanear antes de recibir.','Defensor activo y zona de centro.'),
E('Laterales — 2v1 con extremo','Específico',12,['Laterales','Extremos'],'Coordinar solapamiento/apoyo para crear superioridad exterior.','Pasillo 22x15 m; lateral + extremo vs defensor, con objetivo de centro/pase atrás.','Extremo fija; lateral decide apoyar por fuera o por dentro según defensor.','No hacer movimiento automático: leer al defensor.','El que no tiene balón debe atacar espacio útil.','Añadir central defensor en área.'),
E('Pivotes — perfil y salida bajo presión','Específico',12,['Pivotes'],'Recibir entre primera y segunda línea con perfil abierto y superar presión.','Zona central 15x12 m; pivote, 2 apoyos y 2 defensores.','Pivote se mueve para crear línea, recibe de cara/lado y juega al tercer hombre o gira.','No esconderse detrás del rival; ajustar altura.','Escaneo antes de recibir y primer toque orientado.','Limitar a 2 toques.'),
E('Pivotes — cobertura tras pérdida','Específico',10,['Pivotes'],'Entender cuándo saltar y cuándo proteger el centro tras pérdida.','Zona central; equipo atacante con pivote y 2 rivales de salida.','Tras pérdida, pivote identifica si puede presionar al balón o debe cerrar pase interior.','No abandonar zona central sin cobertura.','Prioridad: proteger portería y pase vertical.','Añadir dos salidas rivales.'),
E('Interiores — recibir entre líneas y girar','Específico',12,['Interiores','Mediapuntas'],'Recibir entre líneas orientado hacia portería y progresar.','Zona entre líneas 15x12 m; pasador, interior y defensor.','Interior se separa del defensor, recibe perfilado y decide girar, conducir o jugar de cara.','No recibir quieto; crear línea diagonal.','Primer toque hacia portería cuando hay espacio.','Defensor activo.'),
E('Interiores — llegada al área desde segunda línea','Específico',12,['Interiores'],'Temporizar llegada al área sin invadir zona del delantero.','Media cancha; interior, extremo, delantero y defensa.','Extremo progresa, delantero fija central e interior llega desde atrás al pase atrás/frontal.','Llegar, no esperar dentro del área.','Correr cuando el balón puede progresar, no antes.','Añadir segundo interior.'),
E('Mediapuntas — recibir entre líneas y último pase','Específico',12,['Mediapuntas','Delanteros','Extremos'],'Mejorar recepción entre líneas y pase que rompe última línea.','Zona frontal 20x15 m; mediapunta, 2 atacantes y 2 defensores.','Mediapunta aparece entre líneas, recibe y busca pase a ruptura o finalización propia.','No jugar de espaldas sin apoyo.','Esperar el momento del desmarque antes de pasar.','Defensores activos y transición.'),
E('Extremos — 1v1 y decisión final','Específico',12,['Extremos'],'Superar rival y decidir entre centro, pase atrás o finalización.','Pasillo 20x15 m hacia área; extremo + apoyo vs defensor.','Recibe abierto, encara y tras superar decide según posición del delantero y defensa.','No centrar por rutina.','Levantar cabeza después de superar.','Añadir segundo defensor.'),
E('Extremos — diagonal hacia dentro','Específico',10,['Extremos','Mediapuntas','Delanteros'],'Atacar espacio interior desde banda para combinar o finalizar.','Media cancha; extremo, lateral, interior y delantero vs defensa.','Extremo parte ancho, recibe y ataca diagonal cuando lateral fija fuera.','No cerrar demasiado pronto y quitar espacio al lateral.','Cambio de ritmo en el momento de entrar.','Permitir tiro desde frontal.'),
E('Delanteros — desmarque de apoyo y ruptura','Específico',12,['Delanteros','Mediapuntas','Extremos'],'Coordinar apoyo corto y ruptura profunda para mover centrales.','Zona 25x20 m; delantero, pasador, extremo y 2 defensores.','Delantero amaga apoyo, arrastra central y rompe al espacio; alternar con apoyo real.','No hacer siempre la misma dirección.','Cambio de ritmo y lectura del defensor.','Añadir fuera de juego real si el espacio lo permite.'),
E('Delanteros — primer palo, segundo palo y rechace','Específico',10,['Delanteros','Extremos','Mediapuntas'],'Mejorar ocupación de zonas de remate y reacción a rechaces.','Área; centrador + 2 delanteros + defensa pasiva.','Uno ataca primer palo, otro segundo y un tercer atacante espera frontal/rechace.','No cruzar carreras sin necesidad.','Atacar balón con decisión y reaccionar al rechace.','Defensa activa.'),
E('Vuelta a la calma y movilidad','Charla',6,POS,'Bajar pulsaciones y terminar con movilidad sencilla.','Todo el grupo, sin material.','Caminar 1-2 min y realizar movilidad suave de tobillo, cadera, aductores, isquios y tronco.','Sin rebotes ni dolor.','Respiración tranquila y buena ejecución.','Usar 1-2 minutos finales para recordar aprendizaje clave.')
];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{ex:SEED,ses:[],lib:3};if(db.lib<3){db.ex=SEED;db.lib=3;save()}
let tab='ses',cur=null,editExId=null,editItem=-1,cat='Todos',pos='Todas',toast='';function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}function S(){return db.ses.find(x=>x.id===cur)}function total(s){return s.items.reduce((a,i)=>a+(i.kind==='parallel'?Math.max(...i.groups.map(g=>+g.m||0),0):(+i.m||0)),0)}function endTime(s){let [h,m]=(s.start||'18:00').split(':').map(Number),z=h*60+m+total(s);return String(Math.floor(z/60)%24).padStart(2,'0')+':'+String(z%60).padStart(2,'0')}function posTags(p){return (p||[]).map(x=>`<span class="pos">${SHORT[x]||x}</span>`).join(' ')}function go(t){tab=t;editExId=null;cur=null;render()}function newS(old=false){let d=new Date().toISOString().slice(0,10);db.ses.unshift({id:crypto.randomUUID(),name:old?'Sesión anterior':'Nueva sesión',date:d,start:'18:00',st:'programada',items:[]});cur=db.ses[0].id;render()}function openS(id){cur=id;editItem=-1;render()}function addEx(id){let e=db.ex.find(x=>x.id===id);S().items.push({...e,id:undefined,kind:'ex'});save();render()}function addParallel(){S().items.push({kind:'parallel',n:'Trabajo simultáneo por posiciones',groups:[]});save();editItem=S().items.length-1;render()}function removeItem(k){S().items.splice(k,1);save();render()}function move(k,d){let a=S().items,n=k+d;if(n<0||n>=a.length)return;[a[k],a[n]]=[a[n],a[k]];save();render()}function setF(k,v){S()[k]=v;save();render()}function setM(k,v){S().items[k].m=Math.max(1,+v||1);save();render()}function newExercise(){let e=E('Nuevo ejercicio','Técnica',10,['Pivotes'],'','','','','','');db.ex.push(e);editExId=e.id;save();render()}function saveExercise(){let e=db.ex.find(x=>x.id===editExId);e.n=val('en');e.c=val('ec');e.m=+val('em')||10;e.pos=POS.filter((_,i)=>document.getElementById('p'+i)?.checked);e.obj=val('eo');e.org=val('eo2');e.dev=val('ed');e.rules=val('er');e.coach=val('ecor');e.prog=val('ep');save();editExId=null;render()}function val(id){return document.getElementById(id)?.value||''}function delExercise(id){db.ex=db.ex.filter(e=>e.id!==id);save();editExId=null;render()}
function editCurrentItem(k){editItem=k;render()}function addGroup(){let i=S().items[editItem];i.groups.push({n:'Nuevo ejercicio',m:10,pos:[],obj:'',org:'',dev:'',rules:'',coach:'',prog:''});save();render()}function rmGroup(g){S().items[editItem].groups.splice(g,1);save();render()}function updateGroup(g,k,v){S().items[editItem].groups[g][k]=k==='m'?Math.max(1,+v||1):v;save()}
function detail(e){return `<div class="detail"><b>Objetivo</b><div>${esc(e.obj)}</div><b>Organización</b><div>${esc(e.org)}</div><b>Desarrollo</b><div>${esc(e.dev)}</div><b>Reglas</b><div>${esc(e.rules)}</div><b>Correcciones</b><div>${esc(e.coach)}</div><b>Progresión</b><div>${esc(e.prog)}</div></div>`}
function exerciseCard(e,action){return `<div class="card"><div class="row"><div class="grow"><b>${esc(e.n)}</b><div class="meta"><span class="tag">${e.c}</span><span class="badge">${e.m} min</span></div><div class="meta">${posTags(e.pos)}</div><div class="soft">${esc(e.obj)}</div></div>${action||''}</div></div>`}
function itemEditor(i,k){if(i.kind==='parallel')return parallelEditor(i,k);let e=i;return `<div class="card"><h2>Editar ejercicio ${k+1}</h2><input value="${esc(e.n)}" onchange="S().items[${k}].n=this.value;save()"><div class="grid2"><input type="number" value="${e.m}" onchange="setM(${k},this.value)"><select onchange="S().items[${k}].c=this.value;save()">${CATS.map(c=>`<option ${c===e.c?'selected':''}>${c}</option>`).join('')}</select></div>${['obj','org','dev','rules','coach','prog'].map((x,j)=>`<textarea id="i${j}" rows="${j===2?4:2}" placeholder="${({obj:'Objetivo',org:'Organización',dev:'Desarrollo',rules:'Reglas / condiciones',coach:'Correcciones del entrenador',prog:'Progresión'})[x]}">${esc(e[x]||'')}</textarea>`).join('')}<div class="row"><button class="p grow" onclick="['obj','org','dev','rules','coach','prog'].forEach((x,j)=>S().items[${k}][x]=document.getElementById('i'+j).value);save();editItem=-1;render()">Guardar</button><button onclick="editItem=-1;render()">Cerrar</button><button class="x" onclick="removeItem(${k})">Quitar</button></div></div>`}
function parallelEditor(i,k){return `<div class="block"><h2>Trabajo simultáneo por posiciones</h2><div class="note">Los grupos trabajan a la vez. El bloque contabiliza solo el tiempo real del grupo más largo.</div>${i.groups.map((g,j)=>`<div class="group"><div class="row"><b class="grow">Grupo ${j+1}</b><input style="width:72px" type="number" value="${g.m}" onchange="updateGroup(${j},'m',this.value)"><button class="s x" onclick="rmGroup(${j})">Quitar</button></div><input value="${esc(g.n)}" onchange="updateGroup(${j},'n',this.value)" placeholder="Ejercicio"><div class="meta">${posTags(g.pos)}</div><div class="soft">${esc(g.obj)}</div><textarea id="g${j}dev" rows="3" placeholder="Desarrollo">${esc(g.dev)}</textarea><textarea id="g${j}org" rows="2" placeholder="Organización">${esc(g.org)}</textarea><textarea id="g${j}rules" rows="2" placeholder="Reglas">${esc(g.rules)}</textarea><textarea id="g${j}coach" rows="2" placeholder="Correcciones">${esc(g.coach)}</textarea><textarea id="g${j}prog" rows="2" placeholder="Progresión">${esc(g.prog)}</textarea><div class="grid2">${POS.map(p=>`<button class="s ${g.pos.includes(p)?'on':''}" onclick="let q=S().items[${k}].groups[${j}];q.pos=q.pos.includes('${p}')?q.pos.filter(x=>x!=='${p}'):q.pos.concat('${p}');save();render()">${SHORT[p]} ${p}</button>`).join('')}</div><button class="s" onclick="let q=S().items[${k}].groups[${j}];q.dev=document.getElementById('g${j}dev').value;q.org=document.getElementById('g${j}org').value;q.rules=document.getElementById('g${j}rules').value;q.coach=document.getElementById('g${j}coach').value;q.prog=document.getElementById('g${j}prog').value;save();render()">Guardar grupo</button></div>`).join('')}<button class="p" onclick="addGroup()">+ Añadir grupo</button> <button onclick="editItem=-1;render()">Cerrar</button></div>`}
function pdf(){let s=S(),{jsPDF}=window.jspdf,doc=new jsPDF();let y=15;const W=180;function text(t,size=10,space=5){doc.setFontSize(size);let a=doc.splitTextToSize(String(t||''),W);if(y+space*a.length>285){doc.addPage();y=15}doc.text(a,15,y);y+=space*a.length+3}doc.setFontSize(18);doc.text(s.name,15,y);y+=8;text(`${s.date} · ${s.start||'18:00'}–${endTime(s)} · ${total(s)} min`,10,5);s.items.forEach((i,k)=>{if(i.kind==='parallel'){if(y>260){doc.addPage();y=15}doc.setFontSize(13);doc.text(`BLOQUE SIMULTÁNEO POR POSICIONES · ${Math.max(...i.groups.map(g=>+g.m||0),0)} min reales`,15,y);y+=7;text('Los grupos trabajan al mismo tiempo; se contabiliza solo el grupo más largo.',9,4);i.groups.forEach((g,j)=>{text(`${j+1}. ${g.n} · ${g.m} min · ${(g.pos||[]).join(', ')}`,10,4);text('Objetivo: '+g.obj,9,4);text('Organización: '+g.org,9,4);text('Desarrollo: '+g.dev,9,4);text('Reglas: '+g.rules,9,4);text('Correcciones: '+g.coach,9,4);text('Progresión: '+g.prog,9,4)})}else{text(`${k+1}. ${i.n} · ${i.m} min · ${i.c}`,12,5);text('Posiciones: '+(i.pos||[]).join(', '),9,4);text('Objetivo: '+i.obj,9,4);text('Organización: '+i.org,9,4);text('Desarrollo: '+i.dev,9,4);text('Reglas: '+i.rules,9,4);text('Correcciones: '+i.coach,9,4);text('Progresión: '+i.prog,9,4)}});doc.save((s.name||'sesion').replace(/[^a-z0-9áéíóúñ _-]/gi,'')+'.pdf')}
function render(){let h='<h1>⚽ Sesiones Sub13</h1>';if(editExId){let e=db.ex.find(x=>x.id===editExId);h+=`<div class="card"><h2>${e.n==='Nuevo ejercicio'?'Nuevo ejercicio':'Editar ejercicio'}</h2><input id="en" value="${esc(e.n)}" placeholder="Nombre"><div class="grid2"><select id="ec">${CATS.map(c=>`<option ${c===e.c?'selected':''}>${c}</option>`).join('')}</select><input id="em" type="number" value="${e.m}" placeholder="Minutos"></div><div class="meta">${POS.map((p,i)=>`<label class="pos"><input id="p${i}" type="checkbox" style="width:auto;margin:0" ${e.pos.includes(p)?'checked':''}> ${SHORT[p]}</label>`).join('')}</div><textarea id="eo" rows="2" placeholder="Objetivo">${esc(e.obj)}</textarea><textarea id="eo2" rows="2" placeholder="Organización">${esc(e.org)}</textarea><textarea id="ed" rows="4" placeholder="Desarrollo">${esc(e.dev)}</textarea><textarea id="er" rows="2" placeholder="Reglas / condiciones">${esc(e.rules)}</textarea><textarea id="ecor" rows="2" placeholder="Correcciones del entrenador">${esc(e.coach)}</textarea><textarea id="ep" rows="2" placeholder="Progresión">${esc(e.prog)}</textarea><div class="row"><button class="p grow" onclick="saveExercise()">Guardar</button><button onclick="editExId=null;render()">Cancelar</button><button class="x" onclick="delExercise('${e.id}')">Borrar</button></div></div>`;document.getElementById('app').innerHTML=h;return}
h+='<div class="tabs"><button class="'+(tab==='ses'?'on':'')+'" onclick="go(\'ses\')">Sesiones</button><button class="'+(tab==='ex'?'on':'')+'" onclick="go(\'ex\')">Biblioteca</button></div>';if(cur){let s=S(),t=total(s);h+=`<button class="s" onclick="cur=null;render()">← Sesiones</button><div class="card"><input value="${esc(s.name)}" onchange="setF('name',this.value)"><div class="grid2"><input type="date" value="${s.date}" onchange="setF('date',this.value)"><input type="time" value="${s.start||'18:00'}" onchange="setF('start',this.value)"></div><b>${t} min reales · fin ${endTime(s)}</b></div>`;s.items.forEach((i,k)=>{if(editItem===k){h+=itemEditor(i,k);return}if(i.kind==='parallel'){let m=Math.max(...i.groups.map(g=>+g.m||0),0);h+=`<div class="block"><div class="row"><b class="grow">TRABAJO SIMULTÁNEO POR POSICIONES</b><span class="badge">${m} min</span></div><div class="note">Cuenta solo ${m} min porque los grupos se realizan al mismo tiempo.</div>${i.groups.map(g=>`<div class="group"><b>${esc(g.n)}</b> · ${g.m} min<div class="meta">${posTags(g.pos)}</div><div class="soft">${esc(g.obj)}</div></div>`).join('')}<div class="row" style="margin-top:8px"><button class="s" onclick="editCurrentItem(${k})">✎ Editar</button><button class="s" onclick="move(${k},-1)">▲</button><button class="s" onclick="move(${k},1)">▼</button><button class="s x" onclick="removeItem(${k})">Quitar</button></div></div>`}else h+=`<div class="card"><div class="row"><div class="grow"><b>${k+1}. ${esc(i.n)}</b><div class="meta"><span class="tag">${i.c}</span><span class="badge">${i.m} min</span>${posTags(i.pos)}</div><div class="soft">${esc(i.obj)}</div></div><input style="width:64px" type="number" value="${i.m}" onchange="setM(${k},this.value)"></div><div class="row" style="margin-top:7px"><button class="s" onclick="editCurrentItem(${k})">✎ Detalle</button><button class="s" onclick="move(${k},-1)">▲</button><button class="s" onclick="move(${k},1)">▼</button><button class="s x" onclick="removeItem(${k})">Quitar</button></div></div>`});h+=`<button class="p" style="width:100%;margin:5px 0" onclick="cat='Todos';pos='Todas';renderPicker=true;render()">+ Añadir ejercicio</button><button style="width:100%;margin-bottom:7px" onclick="addParallel()">＋ Crear bloque simultáneo por posiciones</button><button class="p" style="width:100%;margin-bottom:7px" onclick="save();cur=null;toast='Sesión guardada';render()">💾 Guardar sesión</button><button style="width:100%" onclick="pdf()">📄 Generar PDF</button>`;if(window.renderPicker){h+=pickerUI();window.renderPicker=false}}
else if(tab==='ses'){h+=`<button class="p" style="width:100%;margin-bottom:9px" onclick="newS()">+ Nueva sesión</button>`;db.ses.forEach(s=>h+=`<div class="card" onclick="openS('${s.id}')"><b>${esc(s.name)}</b><div class="soft">${s.date} · ${s.start||'18:00'}–${endTime(s)} · ${total(s)} min</div></div>`)}else{h+=`<button class="p" style="width:100%;margin-bottom:9px" onclick="newExercise()">+ Nuevo ejercicio</button>`;h+=`<div class="chips">${['Todos',...CATS].map(c=>`<button class="s ${cat===c?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div>`;POS.forEach(p=>{});let list=db.ex.filter(e=>(cat==='Todos'||e.c===cat)&&(pos==='Todas'||e.pos.includes(pos)));list.forEach(e=>h+=exerciseCard(e,`<button class="s" onclick="event.stopPropagation();editExId='${e.id}';render()">Editar</button>`))}document.getElementById('app').innerHTML=h}
function pickerUI(){let list=db.ex.filter(e=>(cat==='Todos'||e.c===cat)&&(pos==='Todas'||e.pos.includes(pos)));return `<div class="card"><h2>Elegir ejercicio</h2><div class="chips">${['Todos',...CATS].map(c=>`<button class="s ${cat===c?'on':''}" onclick="cat='${c}';renderPicker=true;render()">${c}</button>`).join('')}</div><div class="chips">${['Todas',...POS].map(p=>`<button class="s ${pos===p?'on':''}" onclick="pos='${p}';renderPicker=true;render()">${p==='Todas'?'Todas':SHORT[p]}</button>`).join('')}</div>${list.map(e=>exerciseCard(e,`<button class="s p" onclick="addEx('${e.id}')">Añadir</button>`)).join('')}<button onclick="render()">Cerrar</button></div>`}
render();
</script></body></html>
