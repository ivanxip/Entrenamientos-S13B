function endT(s){var p=(s.start||"18:00").split(":"),m=((+p[0])*60+(+p[1])+tot(s))%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}

else if(cur&&S()){var s=S(),t=tot(s),d=t-TARGET,col=d===0?"var(--ac)":(d>0?"var(--bad)":"var(--warn)");

if(!s.items.length)h+='<div class="soft" style="text-align:center;margin:14px">Añade ejercicios a la sesión.</div>';
s.items.forEach(function(i,k){if(ei===k){h+=itemForm(i,k);return}h+='<div class="card">'+(i.t?'<div style="max-width:240px">'+diag(i.t)+'</div>':"")+'<div class="row" style="margin-top:8px"><div class="grow"><b>'+(k+1)+'. '+esc(i.n)+'</b> <span class="tag">'+esc(i.c)+'</span><div class="soft">'+esc(i.d)+'</div>'+vl(i.v)+'</div><input class="mn" type="number" inputmode="numeric" value="'+i.m+'" onchange="setM('+k+',this.value)"></div><div class="row" style="margin-top:8px"><button class="s" onclick="mv('+k+',-1)">▲</button><button class="s" onclick="mv('+k+',1)">▼</button><span class="grow"></span><button class="s" onclick="editI('+k+')">✎ Editar</button><button class="s x" onclick="rm('+k+')">Quitar</button></div></div>'});
if(picker){h+='<div class="card"><h2>Elegir ejercicio</h2><div class="chips">'+["Todos"].concat(CATS).map(function(c){return'<button class="s '+(pcat===c?"on":"")+'" onclick="pc(\''+c+'\')">'+c+'</button>'}).join("")+'</div>';
ex.filter(function(e){return pcat==="Todos"||e.c===pcat}).forEach(function(e){h+=exRow(e,'<button class="s p" onclick="addI(\''+e.id+'\')">Añadir</button>')});h+='<button onclick="picker=false;R()">Cerrar</button></div>'}
else h+='<button class="p" style="width:100%;margin-bottom:8px" onclick="picker=true;R()">+ Añadir ejercicio</button>';
h+='<div class="soft" style="margin:6px 0 4px">Estado de la sesión</div><div class="row" style="margin-bottom:8px">'+[["programada","📅 Programada"],["finalizada","✅ Finalizada"],["cancelada","❌ Cancelada"]].map(function(x){return '<button class="grow s '+((s.st||"programada")===x[0]?"on":"")+'" onclick="setF(\'st\',\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div><button class="p" style="width:100%;margin-bottom:8px" onclick="finS()">💾 Guardar sesión</button><div class="row"><button class="grow" onclick="copyS()">📋 Copiar</button><button class="grow" onclick="pdfS()">📄 PDF</button><button class="grow" onclick="dupS(\''+s.id+'\')">Duplicar</button><button class="x" onclick="delS(\''+s.id+'\')">Borrar</button></div>'}
else if(tab==="ses"){if(toast){h+='<div class="card" style="border-color:var(--ac)">'+esc(toast)+'</div>';toast=""}h+='<button class="p" style="width:100%;margin-bottom:10px" onclick="newS()">+ Nueva sesión</button><button style="width:100%;margin-bottom:10px" onclick="newS(1)">🕘 Añadir sesión anterior</button>';

ses.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).forEach(function(s){var t=tot(s);h+='<div class="card" onclick="openS(\''+s.id+'\')"><b>'+esc(s.name)+'</b> <span class="tag">'+({programada:"📅 Programada",finalizada:"✅ Finalizada",cancelada:"❌ Cancelada"}[s.st||"programada"])+'</span><div class="soft">'+fd(s.date)+' · '+(s.start||"18:00")+'–'+endT(s)+' · '+t+' min'+(t===TARGET?" ✓":"")+'</div></div>'})}
else{h+='<button class="p" style="width:100%;margin-bottom:10px" onclick="newEx()">+ Nuevo ejercicio</button>';
CATS.forEach(function(c){var l=ex.filter(function(e){return e.c===c});if(l.length){h+='<div class="soft" style="margin:10px 0 4px"><b>'+c.toUpperCase()+'</b></div>';l.forEach(function(e){h+=exRow(e,'<button class="s" onclick="editEx(\''+e.id+'\')">Editar</button>')})}})}
if(!cur&&!ef)h+=shareCard();
document.getElementById("app").innerHTML=h}
R();
